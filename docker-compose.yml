services:
  svc-transcription:
    build: .
    container_name: svc-transcription
    ports:
      - "3005:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/transcription
      
      # Azure Speech Services (leave empty for local development)
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    depends_on:
      - db
    networks:
      - rso-network

  db:
    image: postgres:16-alpine
    container_name: transcription-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcription
    ports:
      - "5434:5432"
    volumes:
      - transcription-db-data:/var/lib/postgresql/data
    networks:
      - rso-network

volumes:
  transcription-db-data:

networks:
  rso-network:
    driver: bridge
